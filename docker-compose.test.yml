# Pulsyn Integration Test Lab
# Run: docker-compose up -d
# Test: npm run test:integration

version: '3.8'

services:
  # === DATABASES ===
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: pulsyn_test
      POSTGRES_USER: pulsyn
      POSTGRES_PASSWORD: pulsyn_test_2026
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-postgres.sql:/docker-entrypoint-initdb.d/init.sql

  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: pulsyn_test_2026
      MYSQL_DATABASE: pulsyn_test
      MYSQL_USER: pulsyn
      MYSQL_PASSWORD: pulsyn_test_2026
    ports:
      - "3306:3306"
    volumes:
      - mysqldata:/var/lib/mysql

  mariadb:
    image: mariadb:11
    environment:
      MYSQL_ROOT_PASSWORD: pulsyn_test_2026
      MYSQL_DATABASE: pulsyn_test
    ports:
      - "3307:3306"

  mongodb:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: pulsyn
      MONGO_INITDB_ROOT_PASSWORD: pulsyn_test_2026
    ports:
      - "27017:27017"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  cassandra:
    image: cassandra:4
    ports:
      - "9042:9042"
    environment:
      CASSANDRA_CLUSTER_NAME: pulsyn_test

  clickhouse:
    image: clickhouse/clickhouse-server:24
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      CLICKHOUSE_DB: pulsyn_test
      CLICKHOUSE_USER: pulsyn
      CLICKHOUSE_PASSWORD: pulsyn_test_2026

  neo4j:
    image: neo4j:5
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: pulsyn/pulsyn_test_2026

  cockroachdb:
    image: cockroachdb/cockroach:v24.1
    command: start-single-node --insecure
    ports:
      - "26257:26257"
      - "8080:8080"

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_DB: pulsyn_test
      POSTGRES_USER: pulsyn
      POSTGRES_PASSWORD: pulsyn_test_2026
    ports:
      - "5433:5432"

  # === STREAMING ===
  kafka:
    image: confluentinc/cp-kafka:7.6
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: pulsyn-test-cluster-id

  elasticsearch:
    image: elasticsearch:8.13.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"

  # === KEY-VALUE / CACHE ===
  memcached:
    image: memcached:1.6-alpine
    ports:
      - "11211:11211"

  # === SEARCH ===
  meilisearch:
    image: getmeili/meilisearch:v1.7
    ports:
      - "7700:7700"
    environment:
      MEILI_MASTER_KEY: pulsyn_test_2026

  # === TIME-SERIES ===
  influxdb:
    image: influxdb:2.7
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: pulsyn
      DOCKER_INFLUXDB_INIT_PASSWORD: pulsyn_test_2026
      DOCKER_INFLUXDB_INIT_ORG: pulsyn
      DOCKER_INFLUXDB_INIT_BUCKET: pulsyn_test
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: pulsyn_test_token_2026

volumes:
  pgdata:
  mysqldata:
