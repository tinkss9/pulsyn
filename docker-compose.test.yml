version: '3.8'
services:
  postgres:
    image: postgres:16
    ports: ['5432:5432']
    environment: { POSTGRES_USER: test, POSTGRES_PASSWORD: test, POSTGRES_DB: testdb }
    command: ['postgres', '-c', 'wal_level=logical', '-c', 'max_replication_slots=5']
  mysql:
    image: mysql:8.0
    ports: ['3306:3306']
    environment: { MYSQL_ROOT_PASSWORD: test, MYSQL_DATABASE: testdb }
    command: ['--binlog-format=ROW', '--log-bin=mysql-bin', '--server-id=1']
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    ports: ['1433:1433']
    environment: { ACCEPT_EULA: 'Y', SA_PASSWORD: 'Test@12345' }
  redis:
    image: redis:7-alpine
    ports: ['6379:6379']
  mongodb:
    image: mongo:7
    ports: ['27017:27017']
    environment: { MONGO_INITDB_ROOT_USERNAME: test, MONGO_INITDB_ROOT_PASSWORD: test }
  localstack:
    image: minio/minio:latest
    ports: ['4566:9000', '4567:9001']
    environment: { MINIO_ROOT_USER: test, MINIO_ROOT_PASSWORD: testtest }
    command: server /data --console-address ":9001"
  wiremock:
    image: wiremock/wiremock:latest
    ports: ['8080:8080']
    volumes: ['./fixtures/wiremock:/home/wiremock/mappings']
  # Lane B: Additional databases
  mariadb:
    image: mariadb:11
    ports: ['3307:3306']
    environment: { MARIADB_ROOT_PASSWORD: test, MARIADB_DATABASE: testdb }
  cockroachdb:
    image: cockroachdb/cockroach:latest
    ports: ['26257:26257', '8081:8080']
    command: start-single-node --insecure
  neo4j:
    image: neo4j:5
    ports: ['7474:7474', '7687:7687']
    environment: { NEO4J_AUTH: neo4j/testpassword }
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    ports: ['8123:8123', '9000:9000']
    environment: { CLICKHOUSE_USER: test, CLICKHOUSE_PASSWORD: test, CLICKHOUSE_DB: testdb }
  influxdb:
    image: influxdb:2.7
    ports: ['8086:8086']
    environment: { DOCKER_INFLUXDB_INIT_MODE: setup, DOCKER_INFLUXDB_INIT_USERNAME: test, DOCKER_INFLUXDB_INIT_PASSWORD: testtest, DOCKER_INFLUXDB_INIT_ORG: testorg, DOCKER_INFLUXDB_INIT_BUCKET: testdb, DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: testtoken }
  elasticsearch:
    image: elasticsearch:8.11.0
    ports: ['9200:9200']
    environment: { discovery.type: single-node, xpack.security.enabled: 'false', ES_JAVA_OPTS: '-Xms512m -Xmx512m' }
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    ports: ['5433:5432']
    environment: { POSTGRES_USER: test, POSTGRES_PASSWORD: test, POSTGRES_DB: testdb }
  cassandra:
    image: cassandra:4.1
    ports: ['9042:9042']
    environment: { CASSANDRA_DC: datacenter1 }
  scylladb:
    image: scylladb/scylla:latest
    ports: ['9043:9042']
    command: --smp 1 --memory 512M
  duckdb:
    image: python:3.11-slim
    ports: ['8082:8080']
    command: pip install duckdb && python -c "import duckdb; print('DuckDB ready')"
  # Additional databases for verification
  singlestore:
    image: singlestore/cluster-in-a-box:latest
    ports: ['3308:3306', '8083:8080']
    environment: { ROOT_PASSWORD: test, START_AFTER_DEPLOY: 'true' }
  yugabytedb:
    image: yugabytedb/yugabyte:latest
    ports: ['5434:5433', '9001:9000']
    command: bin/yugabyted start --daemon=false
  scylladb:
    image: scylladb/scylla:latest
    ports: ['9044:9042']
    command: --smp 1 --memory 512M
  tidb:
    image: pingcap/tidb:latest
    ports: ['4001:4000']
    command: --store=mocktikv
  raven:
    image: ravendb/ravendb:latest
    ports: ['8084:8080']
    environment: { RAVEN_Setup_Mode: 'None' }
  rethinkdb:
    image: rethinkdb:latest
    ports: ['8085:8080', '28016:28015']
  surrealdb:
    image: surrealdb/surrealdb:latest
    ports: ['8086:8000']
    command: start --log debug --user root --pass test
  edgedb:
    image: edgedb/edgedb:latest
    ports: ['5657:5656']
    environment: { EDGEDB_SERVER_PASSWORD: test }
  dgraph:
    image: dgraph/standalone:latest
    ports: ['8087:8080', '9081:9080']
