name: Pulsyn Integration Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '0 2 * * *'  # Daily at 2am UTC

jobs:
  integration-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    strategy:
      matrix:
        connector-group:
          - databases
          - streaming
          - saas
        
    services:
      # Databases
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: pulsyn_test
          POSTGRES_USER: pulsyn
          POSTGRES_PASSWORD: pulsyn_test_2026
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: pulsyn_test_2026
          MYSQL_DATABASE: pulsyn_test
          MYSQL_USER: pulsyn
          MYSQL_PASSWORD: pulsyn_test_2026
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      mongodb:
        image: mongo:7
        ports:
          - 27017:27017

      elasticsearch:
        image: elasticsearch:8.13.0
        ports:
          - 9200:9200
        env:
          discovery.type: single-node
          xpack.security.enabled: false
          ES_JAVA_OPTS: "-Xms512m -Xmx512m"

    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build
        run: npm run build
      
      - name: Wait for services
        run: sleep 10
      
      - name: Run integration tests
        run: npx tsx scripts/integration-test.ts
        env:
          CI: true
      
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-results
          path: integration-test-results.json
      
      - name: Comment PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const results = JSON.parse(fs.readFileSync('integration-test-results.json', 'utf8'));
            const body = `## Integration Test Results
            
            | Metric | Count |
            |--------|-------|
            | ✅ Passed | ${results.summary.passed} |
            | ❌ Failed | ${results.summary.failed} |
            | ⏭️ Skipped | ${results.summary.skipped} |
            | 📊 Total | ${results.summary.total} |
            
            ${results.summary.failed > 0 ? '### Failed Connectors\n' + 
              results.results.filter(r => r.status === 'FAIL')
                .map(r => `- ❌ ${r.connector}: ${r.error}`).join('\n') : ''}`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });
