name: Pulsyn Nightly Certification

on:
  schedule:
    # Run at 2:00 AM UTC daily
    - cron: '0 2 * * *'
  workflow_dispatch:
    # Allow manual trigger

jobs:
  certify:
    name: Autonomous Connector Certification
    runs-on: ubuntu-latest
    timeout-minutes: 480 # 8 hours max

    strategy:
      fail-fast: false # Continue even if one phase fails

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0 # Full history for git operations

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: |
          npm ci
          cd packages/core && npm ci

      - name: 🐳 Start Docker services (Lab-Dev)
        run: |
          docker-compose -f docker-compose.lab.yml up -d
          echo "⏳ Waiting for services to be healthy..."
          sleep 30
          docker-compose -f docker-compose.lab.yml ps

      - name: ✅ Verify lab services
        run: |
          echo "PostgreSQL..."
          docker-compose -f docker-compose.lab.yml exec -T postgres pg_isready -U test || echo "PG not ready"

          echo "MySQL..."
          docker-compose -f docker-compose.lab.yml exec -T mysql mysqladmin ping -h localhost || echo "MySQL not ready"

          echo "MongoDB..."
          docker-compose -f docker-compose.lab.yml exec -T mongodb mongosh --eval "db.adminCommand('ping')" || echo "MongoDB not ready"

      - name: 🚀 Run Autonomous Certification
        id: certify
        run: |
          npx tsx scripts/auto-certify/controller.ts 2>&1 | tee cert-output.log
          CERT_EXIT=$?
          echo "cert_exit_code=$CERT_EXIT" >> $GITHUB_OUTPUT
          exit $CERT_EXIT
        env:
          CI: true
          NODE_ENV: test

      - name: 📊 Upload certification results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: certification-results
          path: |
            docs/lab/results/
            docs/lab/cert-matrix.json
            cert-output.log
          retention-days: 30

      - name: 📈 Parse and report metrics
        if: always()
        run: |
          if [ -f docs/lab/results/FINAL-*.json ]; then
            echo "## 📊 Certification Results" >> $GITHUB_STEP_SUMMARY
            cat docs/lab/results/FINAL-*.json | jq '.' >> $GITHUB_STEP_SUMMARY
          fi

      - name: 🔄 Commit results to repo
        if: always()
        uses: EndBug/add-and-commit@v9
        with:
          author_name: pulsyn-auto
          author_email: automation@pulsyn.io
          message: 'chore(cert): nightly automation results'
          push: true
          pull_strategy: 'NO-PULL'
          default_author: github_actions

      - name: 💬 Slack notification (success)
        if: success()
        uses: slackapi/slack-github-action@v1
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK }}
          payload: |
            {
              "text": "✅ Pulsyn nightly certification complete!",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Pulsyn Nightly Certification*\n✅ Success\n<https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Results>"
                  }
                }
              ]
            }

      - name: 💬 Slack notification (failure)
        if: failure()
        uses: slackapi/slack-github-action@v1
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK }}
          payload: |
            {
              "text": "❌ Pulsyn nightly certification FAILED",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Pulsyn Nightly Certification*\n❌ FAILED\n<https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Logs>"
                  }
                }
              ]
            }

      - name: 🧹 Cleanup Docker
        if: always()
        run: |
          docker-compose -f docker-compose.lab.yml down -v
          docker system prune -f
