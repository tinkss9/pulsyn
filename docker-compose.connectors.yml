# Pulsyn Connector Testing Infrastructure
# Usage: docker compose -f docker-compose.connectors.yml up -d

version: '3.8'

services:
  # ─── PostgreSQL ──────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: pulsyn-postgres
    environment:
      POSTGRES_USER: pulsyn
      POSTGRES_PASSWORD: pulsyn_test_2024
      POSTGRES_DB: pulsyn_testdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/seed-postgres.sql:/docker-entrypoint-initdb.d/seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulsyn -d pulsyn_testdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── MySQL ──────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: pulsyn-mysql
    environment:
      MYSQL_ROOT_PASSWORD: pulsyn_root_2024
      MYSQL_USER: pulsyn
      MYSQL_PASSWORD: pulsyn_test_2024
      MYSQL_DATABASE: pulsyn_testdb
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./scripts/seed-mysql.sql:/docker-entrypoint-initdb.d/seed.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-ppulsyn_root_2024"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── MongoDB ────────────────────────────────────────────────
  mongodb:
    image: mongo:7.0
    container_name: pulsyn-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: pulsyn
      MONGO_INITDB_ROOT_PASSWORD: pulsyn_test_2024
      MONGO_INITDB_DATABASE: pulsyn_testdb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')", "-u", "pulsyn", "-p", "pulsyn_test_2024", "--authenticationDatabase", "admin"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── Redis ──────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: pulsyn-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── Elasticsearch ──────────────────────────────────────────
  elasticsearch:
    image: elasticsearch:8.13.0
    container_name: pulsyn-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5

  # ─── ClickHouse ─────────────────────────────────────────────
  clickhouse:
    image: clickhouse/clickhouse-server:24.3-alpine
    container_name: pulsyn-clickhouse
    environment:
      CLICKHOUSE_DB: pulsyn_testdb
      CLICKHOUSE_USER: pulsyn
      CLICKHOUSE_PASSWORD: pulsyn_test_2024
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── Kafka (with Zookeeper) ────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: pulsyn-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: pulsyn-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 5

volumes:
  postgres_data:
  mysql_data:
  mongo_data:
  redis_data:
  es_data:
  clickhouse_data:
